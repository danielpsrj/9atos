# 9Atos — local development stack.
# Kept in sync with compose.yaml (Dockhand deployment). Spec §8.2, host port 3005.
services:
  web:
    build: .
    ports:
      - '3005:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/9atos
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=9atos
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  # Ephemeral test database for repository/API unit tests (plan §6). Started
  # only with `--profile test`; no volume, so it is wiped on `down`.
  db-test:
    image: postgres:16-alpine
    profiles: ['test']
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=9atos_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d 9atos_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
