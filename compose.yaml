# 9Atos — Dockhand stack definition (Dockhand expects this filename).
# Kept in sync with docker-compose.yml (local dev). Spec §8.2, host port 3005
# (Gitea=3000 and Dockhand=3001 are taken on the deploy host).
services:
  web:
    build: .
    ports:
      - "3005:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/9atos
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=9atos
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
